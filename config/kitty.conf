font_family      JetBrains Mono
symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0,U+23FB-U+23FE,U+2665,U+26A1,U+2B58 Symbols Nerd Font Mono
symbol_map U+10F000 Vyntaris Symbols
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

background_opacity 0.8

window_padding_width 25
hide_window_decorations yes
cursor_shape beam
cursor_trail 1
enable_audio_bell no
confirm_os_window_close 0
tab_bar_style powerline
tab_powerline_style slanted

allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
