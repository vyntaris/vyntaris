[workspace]
resolver = "3"
members = ["core", "ui", "apps/*", "daemons/*", "tools/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
vyntaris-core = { path = "core" }
vyntaris-ui = { path = "ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
libc = "0.2"
gio = "0.22"
glib = "0.22"
flate2 = "1"
roxmltree = "0.21"
rusqlite = "0.40"
zip = { version = "9", default-features = false, features = ["deflate"] }
regex = "1"
csv = "1"
cairo = { package = "cairo-rs", version = "0.22", features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
