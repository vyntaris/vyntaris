[package]
name = "vyntaris-phone"
description = "The phone link: this computer's side of KDE Connect's protocol, the shell's own"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
libc.workspace = true
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "process", "signal", "sync", "macros"] }
openssl = "0.10"
tokio-openssl = "0.6"
zbus = { version = "5", default-features = false, features = ["tokio"] }
socket2 = { version = "0.6", features = ["all"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }

[[bin]]
name = "vyntaris-phoned"
path = "src/main.rs"
