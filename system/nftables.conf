#!/usr/bin/nft -f

destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop
    ct state { established, related } accept
    iif lo accept
    meta l4proto { icmp, icmpv6 } accept
    udp dport 5353 accept comment "mDNS: network printers, .local names"
    udp dport 546 ip6 saddr fe80::/10 accept comment "DHCPv6 replies"
    meta l4proto { tcp, udp } th dport 1714-1764 accept comment "the phone link (KDE Connect), answered only while it's on"
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
  chain forward {
    type filter hook forward priority filter
    policy drop
  }
}
