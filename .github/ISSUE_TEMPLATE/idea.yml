name: An idea
description: Something Vyntaris could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What you want to do, and what gets in the way now.
    validations:
      required: true
  - type: textarea
    id: elsewhere
    attributes:
      label: Seen it somewhere else?
      description: Optional. Another system or app that does it well.
